# Publishes a release of all of RollCall (docs/releasing.md, ADR-0025): the phone app's two
# flavors (google and foss) and the server image, with its web app, built from one commit at
# one version. Pushing a tag such as v1.4.0, or v1.4.0-rc.1 for a release candidate, on a
# commit in main checks the tag, builds, signs and checks both APKs, builds the image with the
# version, and runs it end to end, including the upgrade from the previous release's image.
# Only when all of that passes does it push the image's tags and publish one GitHub release
# with both APKs, where Obtainium on each phone finds the flavor it uses. A release candidate
# is a prerelease, and its image is tagged <version>-rc.N. A final release must be on the
# newest release candidate's commit and have an approved release record (ADR-0024); its image
# is tagged <version>, <major>.<minor> and latest.
#
# Run by hand from the Actions page ("Run workflow"), it is a dry run: the same builds, signing
# and tests, publishing nothing, to check the secrets before a tag. It checks only the
# version's form, not the release candidate and record rules.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build for the dry run, such as 1.2.3 or 1.2.3-rc.1 (nothing is published)
        default: "0.0.1"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sirmeili/rollcall # the server image's repository

# An explicit bash runs with pipefail, so a failed check piped through tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  # The tag rules (docs/releasing.md, ADR-0024), before anything is built. Every version must be
  # newer than the newest final release. A release candidate needs its final release not yet out. A final release needs the newest release candidate's
  # commit and exactly one open, approved release record. The dry run checks only the
  # version's form.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # find the final release's approved release record
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      image_tags: ${{ steps.tag.outputs.image_tags }}
      previous_tag: ${{ steps.tag.outputs.previous_tag }}
      previous_commit: ${{ steps.tag.outputs.previous_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version from the tag (or the dry run's input), and check the tag rules
        id: tag
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() {
            echo "$1" >&2
            exit 1
          }
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            echo "Dry run: nothing will be published."
          else
            version="${TAG#v}"
          fi
          # major.minor.patch, each 0-999 with no leading zero and not all 0, then optionally
          # -rc.N with N from 1 and no leading zero.
          part='(0|[1-9][0-9]{0,2})'
          if [[ ! "$version" =~ ^$part\.$part\.$part(-rc\.[1-9][0-9]*)?$ || "$version" =~ ^0\.0\.0 ]]; then
            refuse "The version $version must look like 1.2.3, or 1.2.3-rc.1 for a release candidate (the tag like v1.2.3 or v1.2.3-rc.1), each part 0 to 999 with no leading zero and not all 0, and N from 1 with no leading zero: tag the release again with a valid version (docs/releasing.md, Versioning)"
          fi
          base="${version%%-rc.*}"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            commit=$(git rev-parse "$GITHUB_SHA^{commit}")
            git merge-base --is-ancestor "$commit" origin/main ||
              refuse "The tagged commit $commit is not in main: tag a commit in main (docs/releasing.md, Release candidate)"
            # Newer than the newest final release (v*, else app-v*), so latest never moves
            # back. A final release's own tag is left out of the comparison.
            newest_final() {
              git tag --list "$1*" | sed -nE "s/^$1([0-9]+\.[0-9]+\.[0-9]+)$/\1/p" |
                awk -v base="$base" -v prefix="$1" '$0 != base || prefix != "v"' | sort -V | tail -n 1
            }
            newest_tag=""
            if newest=$(newest_final v) && [[ -n "$newest" ]]; then
              newest_tag="v$newest"
            elif newest=$(newest_final app-v) && [[ -n "$newest" ]]; then
              newest_tag="app-v$newest"
            fi
            # The newer of the two sorts last, and an equal one is not newer either.
            if [[ -n "$newest_tag" && "$(printf '%s\n' "$base" "$newest" | sort -V | tail -n 1)" == "$newest" ]]; then
              refuse "$version is not newer than the newest final release, $newest_tag, so latest would move back: pick the next version after $newest (docs/releasing.md, Versioning) and tag its first release candidate (docs/releasing.md, Release candidate)"
            fi
            if [[ "$version" == *-rc.* ]]; then
              # Up to 1.3.0, a final release was tagged app-v<version>.
              for released in "v$base" "app-v$base"; do
                if git rev-parse -q --verify "refs/tags/$released" > /dev/null; then
                  refuse "$released is already released, so it can't have another release candidate: pick the next version (docs/releasing.md, Versioning) and tag its first release candidate (docs/releasing.md, Release candidate)"
                fi
              done
            else
              rc=$(git tag --list "v$base-rc.*" | sed -nE "s/^v${base//./[.]}-rc[.]([1-9][0-9]*)$/\1/p" | sort -n | tail -n 1)
              if [[ -z "$rc" ]]; then
                refuse "No release candidate for $base: tag and test v$base-rc.1 first (docs/releasing.md, Release candidate)"
              fi
              rc_commit=$(git rev-parse "v$base-rc.$rc^{commit}")
              if [[ "$commit" != "$rc_commit" ]]; then
                refuse "v$base is on $commit, not on the newest release candidate v$base-rc.$rc ($rc_commit): delete the tag and tag $rc_commit (docs/releasing.md, Final release)"
              fi
              records=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-check \
                --label release-approved --limit 1000 --json title \
                --jq "[.[] | select(.title == \"RollCall release $base\")] | length")
              if [[ "$records" == 0 ]]; then
                refuse "No open release-check issue \`RollCall release $base\` with \`release-approved\`: finish the checklist and sign off (docs/releasing.md, Final release)"
              elif [[ "$records" != 1 ]]; then
                refuse "$records open release-check issues are titled \`RollCall release $base\` with \`release-approved\`: close all but the release's record (docs/releasing.md, Final release)"
              fi
            fi
          fi
          # The previous release is the newest final v* tag before this version, else the newest
          # final app-v* tag before it (releases up to 1.3.0 were the app alone). The dry run's
          # version is made up, so its previous release is simply the newest final release.
          newest_before() {
            git tag --list "$1*" | sed -nE "s/^$1([0-9]+\.[0-9]+\.[0-9]+)$/\1/p" |
              if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
                sort -V | tail -n 1
              else
                { cat; echo "$base"; } | sort -V -u | awk -v base="$base" '$0 == base { exit } { previous = $0 } END { print previous }'
              fi
          }
          previous_tag=""
          if previous=$(newest_before v) && [[ -n "$previous" ]]; then
            previous_tag="v$previous"
          elif previous=$(newest_before app-v) && [[ -n "$previous" ]]; then
            previous_tag="app-v$previous"
          fi
          # A release candidate's image is tagged with its version; a final release's with its
          # version, its major.minor, and latest.
          if [[ "$version" == *-rc.* ]]; then
            image_tags="$version"
          else
            image_tags="$version ${version%.*} latest"
          fi
          {
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-rc.* ]] && echo true || echo false)"
            echo "image_tags=$image_tags"
            echo "previous_tag=$previous_tag"
            if [[ -n "$previous_tag" ]]; then echo "previous_commit=$(git rev-parse "$previous_tag^{commit}")"; fi
          } >> "$GITHUB_OUTPUT"

  # Both flavors of the app, built with the web app, signed with the release key from the
  # repository's secrets, and checked.
  app:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      cert: ${{ steps.apks.outputs.cert }} # the signing certificate's SHA-256
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build the signed release (both flavors)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "The release key secrets are not set (android/README.md, Releases)" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon coverageCheck checkFossHasNoGoogleServices assembleRelease -PappVersion="$VERSION"
          rm "$ANDROID_KEYSTORE_FILE"
      # Both flavors must share the app ID and the certificate, so a phone can switch between
      # them by installing the other over the top.
      - name: Check the APKs
        id: apks
        working-directory: android
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          mkdir "$RUNNER_TEMP/app"
          for flavor in google foss; do
            apk="$RUNNER_TEMP/app/rollcall-$VERSION-$flavor.apk"
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "$apk"
            scripts/verify-release.sh "$apk" "$VERSION" "$RELEASE_CERT_SHA256" | tee -a "$RUNNER_TEMP/app/verify.txt"
          done
          certs=$(sed -n 's/.*certificate SHA-256 //p' "$RUNNER_TEMP/app/verify.txt" | sort -u)
          if [[ -z "$certs" || $(wc -l <<<"$certs") != 1 ]]; then
            echo "The two flavors are signed with different certificates" >&2
            exit 1
          fi
          echo "cert=$certs" >> "$GITHUB_OUTPUT"
      - name: Report the dry run's signing
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          CERT: ${{ steps.apks.outputs.cert }}
        run: |
          {
            echo "### Dry run: the app passed, and nothing was published"
            echo
            echo "The release key secrets decode, unlock and sign both flavors (google and foss) of version $VERSION."
            echo
            echo "- Signing certificate SHA-256: \`$CERT\`"
            if [[ -n "$RELEASE_CERT_SHA256" ]]; then
              echo "- It matches RELEASE_CERT_SHA256."
            else
              echo "- RELEASE_CERT_SHA256 is not set: compare the certificate with keytool -list by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Only a tag publishes, so the dry run keeps its signed APKs to itself.
      - name: Keep the checked APKs for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollcall-app
          path: ${{ runner.temp }}/app
          retention-days: 1

  # The image, built at the version, run end to end in the Compose test stack and upgraded from
  # the previous release's image (docs/testing.md).
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the previous release's image
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PREVIOUS_TAG: ${{ needs.check.outputs.previous_tag }}
      PREVIOUS_COMMIT: ${{ needs.check.outputs.previous_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build the image at the version (x86-64)
        run: |
          docker build --platform linux/amd64 --build-arg "ROLLCALL_VERSION=$VERSION" \
            --build-arg "ROLLCALL_COMMIT=$GITHUB_SHA" --tag rollcall:release .
      - name: Log in to the GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A v* release's image is tagged with its version. app-v1.3.0 and earlier had no
      # versioned image, so theirs is the one the Image workflow pushed for the tag's commit,
      # or, if that is missing, the commit built here.
      - name: Get the previous release's image
        run: |
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "No final release before $VERSION: the upgrade test starts from this image."
            echo "PREVIOUS_IMAGE=rollcall:release" >> "$GITHUB_ENV"
            exit 0
          fi
          if [[ "$PREVIOUS_TAG" == v* ]]; then
            image="$IMAGE:${PREVIOUS_TAG#v}"
            docker pull --platform linux/amd64 "$image"
          else
            image="$IMAGE:$PREVIOUS_COMMIT"
            if ! docker pull --platform linux/amd64 "$image"; then
              echo "No image for $PREVIOUS_TAG's commit $PREVIOUS_COMMIT: building it."
              git worktree add --detach "$RUNNER_TEMP/previous" "$PREVIOUS_COMMIT"
              image="rollcall:previous"
              docker build --platform linux/amd64 --tag "$image" "$RUNNER_TEMP/previous"
            fi
          fi
          echo "PREVIOUS_IMAGE=$image" >> "$GITHUB_ENV"
          echo "The upgrade test starts from $PREVIOUS_TAG's image, $image." >> "$GITHUB_STEP_SUMMARY"
      - name: Log out
        run: docker logout ghcr.io
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install the test dependencies
        working-directory: server
        run: uv sync --locked
      - name: Run the image end to end in the Compose test stack, and the upgrade test
        working-directory: server
        run: uv run pytest tests/deploy --no-cov -v
        env:
          FT_COMPOSE_STACK: "1"
          ROLLCALL_IMAGE: rollcall:release
          ROLLCALL_EXPECTED_VERSION: ${{ needs.check.outputs.version }}
      - name: Show the stacks' logs if the tests failed
        if: failure()
        # The end-to-end stack, then the upgrade test's two stacks, under the project names
        # test_upgrade.py gives them. The test server's file needs its required settings set
        # to be read; the logs don't use them.
        env:
          CANDIDATE_TAG: unused
          ROLLCALL_TAG: unused
          SETTINGS_KEY: unused
        run: |
          docker compose -f deploy/test/compose.yaml logs --no-color || true
          docker compose -f deploy/test/compose.yaml -p rollcall-upgrade-previous logs --no-color || true
          docker compose -f deploy/candidate/compose.yaml -p rollcall-upgrade-candidate logs --no-color || true
      # Only a tag publishes, so the dry run's image stays on its runner.
      - name: Save the image for publishing
        if: github.event_name == 'push'
        run: docker save rollcall:release | gzip > "$RUNNER_TEMP/rollcall.tar.gz"
      - name: Keep the tested image for the publish job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollcall-image
          path: ${{ runner.temp }}/rollcall.tar.gz
          retention-days: 1

  # Runs only for a tag, and only once the app and the image have both passed. A final release
  # whose image was pushed but whose GitHub release failed is retried by deleting the tag and
  # pushing it again (docs/releasing.md, Final release).
  publish:
    needs: [check, app, image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      packages: write # push the image's tags
    # One publish at a time, so two tags never race to push latest.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      IMAGE_TAGS: ${{ needs.check.outputs.image_tags }}
      PREVIOUS_TAG: ${{ needs.check.outputs.previous_tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rollcall-app
          path: ${{ runner.temp }}/app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rollcall-image
          path: ${{ runner.temp }}
      - name: Load the tested image
        run: gunzip -c "$RUNNER_TEMP/rollcall.tar.gz" | docker load
      - name: Log in to the GitHub Container Registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image's tags
        run: |
          for tag in $IMAGE_TAGS; do
            docker tag rollcall:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:${IMAGE_TAGS%% *}")
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CERT: ${{ needs.app.outputs.cert }}
        run: |
          google="$RUNNER_TEMP/app/rollcall-$VERSION-google.apk"
          foss="$RUNNER_TEMP/app/rollcall-$VERSION-foss.apk"
          tags=""
          for tag in $IMAGE_TAGS; do tags+="${tags:+, }\`$tag\`"; done
          {
            echo "RollCall $VERSION: the Android app, in two flavors (\`google\` and \`foss\`, with no Google code), and the server image with its web app, built from the same commit and tested together."
            echo
            echo "Install or update the app with Obtainium (android/README.md, Installing on a phone), and update the server as docs/deploy.md says."
            echo
            echo "- \`rollcall-$VERSION-google.apk\` SHA-256: \`$(sha256sum "$google" | cut -d' ' -f1)\`"
            echo "- \`rollcall-$VERSION-foss.apk\` SHA-256: \`$(sha256sum "$foss" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$CERT\`"
            echo "- Image \`$IMAGE\`, tagged $tags"
            echo "- Image digest: \`$DIGEST\`"
          } > "$RUNNER_TEMP/notes.md"
          # A release candidate is a prerelease, so GitHub's Latest release and everyday phones'
          # Obtainium entries skip it. The title starts "RollCall app " for Obtainium's filter.
          options=()
          if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); else options+=(--latest); fi
          if [[ -n "$PREVIOUS_TAG" ]]; then options+=(--notes-start-tag "$PREVIOUS_TAG"); fi
          gh release create "$TAG" "$google" "$foss" --title "RollCall app and server $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag "${options[@]}"
