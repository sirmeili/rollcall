name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on main are grouped by
# commit, so each merge runs in full and none is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On a pull request, works out which areas it changes, so the jobs for the others are
  # skipped. On main every job runs. A skipped job counts as passed, and ci-ok at the end is
  # the one check the main ruleset requires.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # list the pull request's files
    outputs:
      server: ${{ github.event_name == 'push' || steps.filter.outputs.server == 'true' }}
      web: ${{ github.event_name == 'push' || steps.filter.outputs.web == 'true' }}
      e2e: ${{ github.event_name == 'push' || steps.filter.outputs.server == 'true' || steps.filter.outputs.web == 'true' }}
      android: ${{ github.event_name == 'push' || steps.filter.outputs.android == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            server:
              - "server/**"
              - ".github/workflows/ci.yml"
            web:
              - "web/**"
              - ".github/workflows/ci.yml"
            # The app holds its own copy of the web app.
            android:
              - "android/**"
              - "web/**"
              - ".github/workflows/ci.yml"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The central spec and the progress log are retired; only docs/archive/ may name them.
      # The brackets keep this file from matching its own pattern.
      - name: Check nothing points at the retired spec or progress log
        run: |
          if git grep -nE 'docs/SPEC[.]md|PROGRESS[.]md' -- ':!docs/archive/'; then
            echo "::error::These lines name the retired spec or progress log. Point at the issue, GLOSSARY.md, docs/adr/ or docs/archive/SPEC-v1.md instead."
            exit 1
          fi

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Start the fake printer's MQTT broker
        run: |
          sh fakeprinter/make-cert.sh
          docker compose -f fakeprinter/compose.yaml up -d --wait
      - name: Run tests with coverage gate
        run: uv run pytest
        env:
          FT_FAKE_BROKER: 127.0.0.1:8883
          FT_HA_BROKER: 127.0.0.1:11883
      - name: Audit dependencies
        run: |
          uv export --quiet --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run check
      - name: Check formatting
        run: npm run lint
      - name: Run tests with coverage gate
        run: npm run test:coverage
      - name: Audit dependencies
        run: npm run audit
      - name: Build
        run: npm run build

  # Runs when either side changes, once neither server nor web has failed (one of them may
  # have been skipped).
  e2e:
    needs: [changes, server, web]
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install uv
        run: pip install uv==0.13.5
      - name: Install server dependencies
        run: uv sync --locked
        working-directory: server
      - name: Install web dependencies
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps chromium
      - name: Build the web app
        run: npm run build
      - name: Run end-to-end tests against the real server
        run: npm run test:e2e

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Run Kotlin tests with the 90% coverage gate and build the APKs (both flavors)
        working-directory: android
        run: ./gradlew --no-daemon coverageCheck assembleDebug
      # The release build as the release job makes it, signed with a key made for this run,
      # so a broken release setup shows up before a tag is pushed.
      - name: Build and check a test release
        working-directory: android
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/test-release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -keystore "$ANDROID_KEYSTORE_FILE" -storetype PKCS12             -alias rollcall -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI test"             -storepass "$ANDROID_KEYSTORE_PASSWORD"
          ./gradlew --no-daemon assembleRelease -PappVersion=1.2.3
          for flavor in google foss; do
            scripts/verify-release.sh "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" 1.2.3
          done

  # The check the main ruleset requires. It passes when every job above passed or was skipped
  # because its area did not change, so adding a job means adding it here, not to the ruleset.
  ci-ok:
    if: always()
    needs: [changes, docs, server, web, e2e, android]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
