# Publishes the Android app (android/README.md, Releases). Pushing a tag such as app-v1.2.0
# on a commit in main builds both flavors of the app (google and foss) at that version, signs
# them with the release key from the repository's secrets, checks them and attaches them to a
# GitHub Release, where Obtainium on each phone finds the flavor it uses.
#
# Run by hand from the Actions page ("Run workflow"), it is a dry run: the same build, signing
# and checks with the release key, publishing nothing, to check the secrets before a tag.
name: App release

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build for the dry run (nothing is published)
        default: "0.0.1"
        required: true

permissions:
  contents: read

# An explicit bash runs with pipefail, so a failed check piped through tee fails its step.
defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Read the version from the tag (or the dry run's input), and check the commit is in main
        env:
          TAG: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            echo "Dry run: nothing will be published."
          else
            version="${TAG#app-v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The version must look like 1.2.3 (the tag like app-v1.2.3)" >&2
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "The tagged commit is not in main" >&2
              exit 1
            }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the web app and copy it into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build the signed release (both flavors)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "The release key secrets are not set (android/README.md, Releases)" >&2
            exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 -d <<<"$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon coverageCheck assembleRelease -PappVersion="$VERSION"
          rm "$ANDROID_KEYSTORE_FILE"
      # Both flavors must share the app ID and the certificate, so a phone can switch between
      # them by installing the other over the top.
      - name: Check the APKs
        working-directory: android
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          for flavor in google foss; do
            apk="$RUNNER_TEMP/rollcall-$VERSION-$flavor.apk"
            cp "app/build/outputs/apk/$flavor/release/app-$flavor-release.apk" "$apk"
            scripts/verify-release.sh "$apk" "$VERSION" "$RELEASE_CERT_SHA256" | tee -a "$RUNNER_TEMP/verify.txt"
          done
          certs=$(sed -n 's/.*certificate SHA-256 //p' "$RUNNER_TEMP/verify.txt" | sort -u | wc -l)
          if [[ "$certs" != 1 ]]; then
            echo "The two flavors are signed with different certificates" >&2
            exit 1
          fi
      - name: Report the dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          cert=$(sed -n 's/.*certificate SHA-256 //p' "$RUNNER_TEMP/verify.txt" | head -n 1)
          {
            echo "### Dry run passed: nothing was published"
            echo
            echo "The release key secrets decode, unlock and sign both flavors (google and foss) of version $VERSION."
            echo
            echo "- Signing certificate SHA-256: \`$cert\`"
            if [[ -n "$RELEASE_CERT_SHA256" ]]; then
              echo "- It matches RELEASE_CERT_SHA256."
            else
              echo "- RELEASE_CERT_SHA256 is not set: compare the certificate with keytool -list by hand."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cert=$(sed -n 's/.*certificate SHA-256 //p' "$RUNNER_TEMP/verify.txt" | head -n 1)
          google="$RUNNER_TEMP/rollcall-$VERSION-google.apk"
          foss="$RUNNER_TEMP/rollcall-$VERSION-foss.apk"
          {
            echo "RollCall Android app $VERSION, in two flavors: \`google\` and \`foss\` (no Google code)."
            echo
            echo "Install or update it with Obtainium (android/README.md, Installing on a phone)."
            echo
            echo "- \`rollcall-$VERSION-google.apk\` SHA-256: \`$(sha256sum "$google" | cut -d' ' -f1)\`"
            echo "- \`rollcall-$VERSION-foss.apk\` SHA-256: \`$(sha256sum "$foss" | cut -d' ' -f1)\`"
            echo "- Signing certificate SHA-256: \`$cert\`"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$google" "$foss" --title "RollCall app $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag
