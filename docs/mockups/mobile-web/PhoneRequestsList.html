<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Requests · RollCall phone (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Global styles from the approved mockups (docs/mockups/web/, direction A "Workshop").
 * Tokens come from docs/mockups/web/tokens.css. The theme is set on <html data-theme>
 * by the script in app.html and by lib/theme.svelte.ts. Components add scoped styles. */

:root,
:root[data-theme="light"] {
  --bg: #f4f2ee; /* page background */
  --surface: #ffffff; /* cards, header, tables */
  --line: #ddd8cf; /* borders and dividers */
  --text: #1c1b19;
  --muted: #5e5a53; /* secondary text; 6.5:1 on --surface */
  --accent: #b45309; /* primary buttons, active filter, Review badge */
  --onaccent: #ffffff;
  --chip: #ece8e1; /* neutral fills: hover, open-state chip, avatars */
  --lowbg: #fdecd3; /* low stock, flagged, warnings */
  --lowtext: #7c3500;
  --okbg: #dcefe2;
  --oktext: #1f5c33;
  --okdot: #2f8a4e;
  --track: #e9e5de; /* % left bar: track */
  --fill: #3f3b35; /* % left bar: fill */
  --fillLow: #c2410c; /* % left bar: nearly out */
  --danger: #b3261e;

  /* Spool ring swatch: same treatment for every color */
  --ringShadow: 0 1px 3px rgba(0, 0, 0, 0.22), 0 4px 12px rgba(0, 0, 0, 0.16);
  --holeShadow: inset 0 1px 3px rgba(0, 0, 0, 0.18);
  --ringShadowSmall: var(--ringShadow);

  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: Inter, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* The phone layout's bottom bar, and what the pages leave free for it. */
  --bottom-bar: calc(84px + env(safe-area-inset-bottom, 0px));

  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121212;
  --surface: #1c1c1b;
  --line: #34322e;
  --text: #f2efe9;
  --muted: #a9a49b;
  --accent: #f59e0b;
  --onaccent: #1a1205;
  --chip: #262523;
  --lowbg: #3a2608;
  --lowtext: #fbbf5c;
  --okbg: #173322;
  --oktext: #86d9a3;
  --okdot: #4ade80;
  --track: #2c2b28;
  --fill: #d9d4cb;
  --fillLow: #fb923c;
  --danger: #ff8a80;

  /* A gap in the surface color, a thin light rim, then a soft glow, outside and inside the
     ring, so white and black swatches both stay visible. */
  --ringShadow:
    0 0 0 1.5px var(--surface), 0 0 0 2.5px rgba(255, 255, 255, 0.3),
    0 0 10px 2px rgba(255, 255, 255, 0.1);
  --holeShadow:
    inset 0 0 0 1.5px var(--surface), inset 0 0 0 2.5px rgba(255, 255, 255, 0.3),
    inset 0 0 6px 1px rgba(255, 255, 255, 0.1);
  --ringShadowSmall:
    0 0 0 1px var(--surface), 0 0 0 1.75px rgba(255, 255, 255, 0.28),
    0 0 6px 1px rgba(255, 255, 255, 0.08), inset 0 0 0 1px var(--surface),
    inset 0 0 0 1.75px rgba(255, 255, 255, 0.28);

  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html {
  font-family: var(--font-body);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3 {
  font-family: var(--font-head);
}

h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Buttons: neutral by default, .primary for the main action. */
button {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

button.small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* A link that looks like a button, for navigation actions such as "Open spool". */
a.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
}

a.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

button.danger {
  color: var(--danger);
}

/* Filter chips: round, accent when pressed. */
button.chip {
  padding: 10px 16px;
  border-radius: 999px;
}

button.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

input,
select,
textarea {
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  min-height: 44px;
}

textarea {
  padding: 10px 12px;
  min-height: 88px;
  resize: vertical;
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  min-height: 0;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Tables sit in a box that scrolls sideways on phones. */
/* Positioned so screen-reader-only text inside a table scrolls with it instead of widening
   the page (on a phone that pushed the bottom bar off the screen). */
.tablebox {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.label {
  margin: 0;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.mono {
  font-family: var(--font-mono);
}

.muted {
  color: var(--muted);
}

.error {
  color: var(--danger);
  margin: 0;
}

.notice {
  color: var(--lowtext);
  margin: 0;
}

.badge-low {
  background: var(--lowbg);
  color: var(--lowtext);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  white-space: nowrap;
}

.badge-hand {
  border: 1px dashed var(--muted);
  color: var(--muted);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Page heading: title, subtitle, and actions on the right. */
.pagehead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}

.pagehead p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
}

.page {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}


/* ---- Ring swatch (lib/components/ui/Ring.svelte), plus a split ring for multi-color ---- */
:root, :root[data-theme="light"] { --ringOuterSm: var(--ringShadow); --holeSm: none; }
:root[data-theme="dark"] {
  --ringOuterSm: 0 0 0 1px var(--surface), 0 0 0 1.75px rgba(255,255,255,.28), 0 0 6px 1px rgba(255,255,255,.08);
  --holeSm: inset 0 0 0 1px var(--surface), inset 0 0 0 1.75px rgba(255,255,255,.28);
}
.ring { display: inline-block; flex: none; border-radius: 50%; border-style: solid; background: var(--bg); box-shadow: var(--ringShadow), var(--holeShadow); }
.ring.sm { width: 30px; height: 30px; border-width: 8px; box-shadow: var(--ringShadowSmall); }
.ring.multi { border: 0; position: relative; box-shadow: var(--ringOuterSm); }
.ring.multi::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); box-shadow: var(--holeSm); }
li.open .ring.multi::after, .open .ring.multi::after { background: var(--bg); }
[hidden] { display: none !important; }


body{background:#d9d5ce}
:root[data-theme="dark"] body{background:#050505}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.phone{position:relative;width:390px;height:844px;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 10px #1c1b19,0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
@media (max-width:460px){.stage{padding:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}

/* ---- Top bar (PhoneTopBar) ---- */
.top{display:flex;align-items:center;gap:10px;padding:18px 20px 6px;flex:none}
.top .title{margin:0;font-family:var(--font-head);font-size:28px;font-weight:700;letter-spacing:-.02em}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 108px;display:flex;flex-direction:column;gap:10px}

/* ---- Bottom bar (PhoneNav) ---- */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:42;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:8px 14px 14px;border-top:1px solid var(--line);background:var(--surface)}
.end{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.start{justify-self:start}
.finish{justify-self:end}
.end[aria-expanded=true]{color:var(--text)}
.dot{position:absolute;top:4px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.scan{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-30px;color:var(--text);font-size:12px;font-weight:700}
.fab{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--onaccent);box-shadow:0 0 0 5px var(--surface),0 4px 14px rgba(0,0,0,.25)}
.binitial{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--text);font-size:13px;font-weight:700}

/* ---- Sheets (MenuSheet, FilterSheet) ---- */
.dim{position:absolute;inset:0;z-index:40;border:0;border-radius:0;padding:0;min-height:0;background:rgba(0,0,0,.45)}
.dim.over{z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:84px;z-index:41;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 108px);overflow-y:auto;padding:10px 16px 18px;border-radius:24px 24px 0 0;background:var(--surface);outline:none}
.sheet.fs{bottom:0;z-index:51;gap:18px;max-height:calc(100% - 48px);padding-bottom:18px}
.grip{align-self:center;width:40px;height:5px;border-radius:999px;background:var(--line)}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.adminpages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600}
.item.small{flex-direction:column;justify-content:center;gap:4px;min-height:68px;font-size:14px}
.item[aria-current=page]{background:var(--text);border-color:var(--text);color:var(--bg)}
.ibadge{margin-left:auto;background:var(--accent);color:var(--onaccent);border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead h2{margin:0;font-size:20px}
.sheet section{display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip .n{margin-left:4px;font-family:var(--font-mono);font-size:12px;opacity:.75}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.sfoot{display:grid;grid-template-columns:auto 1fr;gap:10px}



/* ---- Requests list, phone ---- */
/* APPROVED DEVIATION (Frank, 17 Nov 2026): the style guide says tables scroll sideways on
   phones, but the phone Requests list uses cards instead of a table. Each card holds the same
   fields as a desktop row (priority, status, number, title, requester for Editors and Admins,
   quantity, where the model is, submitted, needed-by, filament rings), stacked so nothing needs
   sideways scrolling. A table layout was mocked up and turned down. */
.intro{margin:0 2px;font-size:14px;color:var(--muted)}
.meta{margin:0 2px;font-size:13px;color:var(--muted)}
.meta b{color:var(--text);font-family:var(--font-mono)}

.tagchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:6px;white-space:nowrap}
.pri-urgent{background:var(--lowbg);color:var(--lowtext)}
.pri-normal{background:var(--chip);color:var(--text)}
.pri-norush{border:1px dashed var(--muted);color:var(--muted);padding:3px 8px}
.st-submitted{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:3px 8px}
.st-submitted::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}

/* Cards */
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.rcard:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.rtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtop .num{margin-left:auto;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.rtitle{margin:0;font-family:var(--font-head);font-weight:600;font-size:17px;line-height:1.3}
.rtitle a{outline:none}
.rtitle a::after{content:"";position:absolute;inset:0;border-radius:14px}
.rsub{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.rsub .it{display:inline-flex;align-items:center;gap:5px}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.rneed{font-size:13px}
.rneed .mono{font-size:13px}
.rneed .muted{font-size:13px}
.fils{display:flex;align-items:center;gap:5px}
.fils .ring{width:20px;height:20px;border-width:6px}
.fils .more{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.who .initial{width:22px;height:22px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px}

/* New request: bottom action above the bar */
/* APPROVED CHANGE (Frank, 17 Nov 2026): on the Requests screens the bottom bar's centre button is
   New request instead of Scan. Scan only shows on the inventory screens; the spec is being updated
   to say so. Someone who can't submit requests (not a Requester) gets no centre button here. */
.scan .fab svg{width:30px;height:30px}
.bar.nocenter .scan{visibility:hidden}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 18px}
.empty h2{margin:0;font-family:var(--font-head);font-size:20px}
.empty p{margin:0;color:var(--muted);font-size:14px}
.nopage{border:1px dashed var(--muted);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.nopage strong{color:var(--text)}

/* ---- Mockup controls (not part of the design) ---- */
.mock{background:#37352f;color:#f2efe9;padding:8px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:12px}
.mock strong{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.mock .mrow{display:flex;align-items:center;gap:8px}
.mock .mrow > span{opacity:.8}
.mock .mseg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.12)}
.mock button{min-height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:inherit;font-size:12px}
.mock button[aria-pressed=true]{background:#f2efe9;color:#1c1b19}

</style>
</head>
<body>
<aside class="mock" aria-label="Mockup controls">
<strong>Mockup controls</strong>
<div class="mrow"><span>State</span><div class="mseg" role="group" aria-label="State"><button type="button" data-state="list" aria-pressed="true">Requests</button><button type="button" data-state="empty" aria-pressed="false">Empty</button></div></div>
<div class="mrow"><span>Role</span><div class="mseg" role="group" aria-label="Role"><button type="button" data-role="viewer" aria-pressed="false">Viewer</button><button type="button" data-role="editor" aria-pressed="false">Editor</button><button type="button" data-role="admin" aria-pressed="true">Admin</button></div></div>
<div class="mrow"><span>Requester</span><div class="mseg" role="group" aria-label="Requester"><button type="button" data-req="yes" aria-pressed="true">Yes</button><button type="button" data-req="former" aria-pressed="false">No, but was</button><button type="button" data-req="never" aria-pressed="false">Never</button></div></div>
<div class="mrow"><span>Theme</span><div class="mseg" role="group" aria-label="Theme"><button type="button" data-theme="light" aria-pressed="true">Light</button><button type="button" data-theme="dark" aria-pressed="false">Dark</button></div></div>
</aside>
<div class="stage">
<div class="phone" id="phone">
<header class="top">
<a href="#" aria-label="RollCall, Inventory"><svg width="30" height="30" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="62" fill="#C8324B"></circle><circle cx="70" cy="70" r="50" fill="none" stroke="#FFF7F5" stroke-width="4" opacity="0.45"></circle><circle cx="70" cy="70" r="40" fill="none" stroke="#FFF7F5" stroke-width="4" opacity="0.45"></circle><circle cx="70" cy="70" r="30" fill="#FFF7F5"></circle><polyline points="56,71 66,81 85,60" fill="none" stroke="#C8324B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></a>
<p class="title" aria-hidden="true" id="toptitle">Requests</p>
</header>
<div class="scroll" id="scroll">
<h1 class="sr-only" id="h1">Requests</h1>
<div id="content" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<div id="overlay"></div>
<nav aria-label="App" class="bar" id="bar">
<button type="button" class="end start" id="menubtn" aria-expanded="false" aria-controls="menu-sheet" data-act="menu"></button>
<a class="scan" href="#" id="newfab"><span class="fab" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>New request</a>
<a class="end finish" href="#"><span class="binitial" aria-hidden="true" id="binit">F</span><span id="bname">frank</span></a>
</nav>
</div>
</div>
<script>
/* Sample data and logic shared by the Catalog mockups (pasted into each page at build). */

/* In-stock and linked products. link: the catalog color it is tied to; how: "tag" (From its tag)
   or "hand" (Linked by hand). A product with no Sealed or Open spool owns nothing. */
var STOCK = {
  plablue: { name: "PLA Basic Blue", material: "PLA", hex: "#0A2CA5", sealed: 2, open: 0, link: "pla-basic/Blue", how: "tag" },
  marine: { name: "PLA Matte Marine Blue", material: "PLA", hex: "#0078BF", sealed: 0, open: 1, link: "pla-matte/Marine Blue", how: "tag" },
  plabk: { name: "PLA Basic Black", material: "PLA", hex: "#000000", sealed: 1, open: 1, link: "pla-basic/Black", how: "tag" },
  blackpla: { name: "Black PLA", material: "PLA", hex: "#000000", sealed: 1, open: 0, link: "pla-basic/Black", how: "hand" },
  white: { name: "PLA Basic White", material: "PLA", hex: "#FFFFFF", sealed: 3, open: 0, link: "pla-basic/Jade White", how: "tag" },

  var shown = list.slice(0, max), names = list.map(function (k) { return F[k].name; });
  return '<span class="fils" role="img" aria-label="Filament, in order: ' + esc(names.join(", ")) + '">' +
    shown.map(function (k) { return '<span class="ring sm" style="border-color:' + F[k].hex + '"></span>'; }).join("") +
    (list.length > max ? '<span class="more">+' + (list.length - max) + "</span>" : "") + "</span>";
}
function svg(path) { return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">' + path + "</svg>"; }

function cardHtml(r, staff) {
  var p = PRI[r.pri], s = SRC[r.src], u = USERS[r.by];
  return '<li class="rcard">' +
    '<div class="rtop">' +
    (staff ? '<span class="who"><span class="initial" aria-hidden="true">' + u.initial + '</span><span class="sr-only">Requester: </span>' + u.name + "</span>" : "") +
    '<span class="tagchip ' + p.cls + '"><span class="sr-only">Priority: </span>' + p.label + '</span><span class="tagchip st-submitted">Submitted</span>' +
    '<span class="num">#' + r.id + "</span></div>" +
    '<h2 class="rtitle"><a href="#">' + esc(r.title) + "</a></h2>" +
    '<div class="rsub">' +
    '<span class="it">Qty <span class="mono">' + r.qty + '</span></span><span class="it">' + svg(s.icon) + s.text + '</span><span class="it">Submitted ' + rel(r.at) + "</span></div>" +
    '<div class="rfoot"><span class="rneed">' + (r.need ? 'Needed by <span class="mono">' + fmtS(r.need) + '</span> <span class="muted">· ' + rel(r.need) + "</span>" : '<span class="muted">No needed-by date</span>') + "</span>" + filHtml(r.fil, 4) + "</div></li>";
}

function render() {
  var staff = state.role !== "viewer";
  var hasPage = staff || state.req !== "never";
  var canNew = state.req === "yes";
  var me = state.role === "admin" ? ["frank", "F"] : state.role === "editor" ? ["dana", "D"] : ["sam", "S"];
  document.getElementById("bname").textContent = me[0];
  document.getElementById("binit").textContent = me[1];
  var c = document.getElementById("content");
  var rows = state.empty || !hasPage ? [] : REQUESTS.filter(function (r) { return staff || r.by === "sam"; });
  state.count = rows.length;
  var fab = document.getElementById("newfab");
  document.getElementById("bar").classList.toggle("nocenter", !(hasPage && canNew));
  if (hasPage && canNew) fab.removeAttribute("aria-hidden"); else fab.setAttribute("aria-hidden", "true");
  fab.tabIndex = hasPage && canNew ? 0 : -1;
  document.getElementById("toptitle").textContent = hasPage ? "Requests" : "Inventory";
  document.getElementById("h1").textContent = hasPage ? "Requests" : "Inventory";

  if (!hasPage) {
    c.innerHTML = '<div class="nopage"><strong>Mockup note:</strong> a Viewer who has never been a Requester has no Requests page, and Requests isn\'t in their menu. Open the menu to see.</div>';
    renderMenu(); renderOverlay(); return;
  }
  var intro = staff ? "Print requests from everyone. Most urgent first."
    : canNew ? "Your print requests. You can edit one while it's still Submitted."
    : "Your earlier print requests. You can no longer submit or edit them, but you can open them and download their files.";
  var h = '<p class="intro">' + intro + "</p>";
  if (!rows.length) {
    h += '<section class="card empty" aria-labelledby="empty-h"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true" style="color:var(--muted)">' + ICONS.requests + "</svg>" +
      '<h2 id="empty-h">' + (staff ? "No print requests yet" : canNew ? "You haven't asked for any prints yet" : "You don't have any print requests") + "</h2>" +
      "<p>" + (staff ? "Requests from everyone with the Requester permission show up here." : canNew ? "Ask for something to be printed with the New request button below." : "You can no longer submit print requests.") + "</p></section>";
  } else {
    /* APPROVED DEVIATION (Frank, 17 Nov 2026): on phones the sort line is shortened to
       "N requests · most urgent first" instead of the desktop's full "Most urgent first, then by
       needed-by date, then oldest first", to save space on a narrow screen. The sort order itself
       is unchanged: priority, then needed-by (earliest first, no date last), then oldest first.
       The list's aria-label below still gives screen readers the full order. */
    h += '<p class="meta"><b>' + rows.length + "</b> " + (rows.length === 1 ? "request" : "requests") + " · most urgent first</p>";
    h += '<ul class="rlist" aria-label="Print requests, sorted by priority, then needed-by date, then oldest first">' + rows.map(function (r) { return cardHtml(r, staff); }).join("") + "</ul>";
  }
  c.innerHTML = h;
  renderMenu(); renderOverlay();
}

/* ---------- menu ---------- */
function renderMenu() {
  var mb = document.getElementById("menubtn");
  mb.setAttribute("aria-expanded", String(state.menu));
  mb.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">' +
    (state.menu ? '<path d="M6 6l12 12M18 6 6 18"></path>' : '<path d="M4 7h16M4 12h16M4 17h16"></path>') + "</svg>" +
    (state.menu ? "Close" : "Menu") + (state.menu ? "" : '<span class="dot" aria-hidden="true"></span>');
}
function menuHtml() {
  var staff = state.role !== "viewer", hasPage = staff || state.req !== "never";
  var main = [["inventory", "Inventory"], ["spools", "Spools"], ["products", "Products"], ["catalog", "Catalog"]];
  if (hasPage) main.push(["requests", "Requests"]);
  if (staff) main.push(["review", "Review"]);
  main.push(["activity", "Activity"]);
  var n = state.count;
  var h = '<button type="button" class="dim" aria-label="Close the menu" tabindex="-1" data-act="closemenu"></button>' +
    '<div class="sheet" id="menu-sheet" role="dialog" aria-modal="true" aria-label="Menu"><span class="grip" aria-hidden="true"></span><nav aria-label="Pages" class="pages">';
  main.forEach(function (m) {
    var cur = (m[0] === "requests" && hasPage) || (m[0] === "inventory" && !hasPage);
    var badge = m[0] === "requests" && n ? n : m[0] === "review" ? 3 : 0;
    var label = m[0] === "requests" && n ? ' aria-label="Requests, ' + n + ' submitted"' : m[0] === "review" ? ' aria-label="Review, 3 waiting"' : "";
    h += '<a class="item" href="#"' + (cur ? ' aria-current="page"' : "") + label + ">" + icon(m[0]) + m[1] + (badge ? '<span class="ibadge" aria-hidden="true">' + badge + "</span>" : "") + "</a>";
  });
  h += "</nav>";
  if (state.role === "admin") {
    h += '<div class="label">Admin</div><nav aria-label="Admin pages" class="adminpages">';
    [["devices", "Devices"], ["users", "Users"], ["settings", "Settings"]].forEach(function (m) { h += '<a class="item small" href="#">' + icon(m[0]) + m[1] + "</a>"; });
    h += "</nav>";
  }
  return h + "</div>";
}
function renderOverlay() { document.getElementById("overlay").innerHTML = state.menu ? menuHtml() : ""; }

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && state.menu) { state.menu = false; renderMenu(); renderOverlay(); document.getElementById("menubtn").focus(); }
});
document.addEventListener("click", function (e) {
  var t = e.target.closest("button, a");
  if (!t) return;
  if (t.tagName === "A" && t.getAttribute("href") === "#") e.preventDefault();
  var d = t.dataset;
  if (d.act === "menu") { state.menu = !state.menu; renderMenu(); renderOverlay(); var first = document.querySelector("#menu-sheet a"); if (state.menu && first) first.focus(); }
  else if (d.act === "closemenu") { state.menu = false; renderMenu(); renderOverlay(); document.getElementById("menubtn").focus(); }
  else if (d.state) { pick(t); state.empty = d.state === "empty"; render(); }
  else if (d.role) { pick(t); state.role = d.role; render(); }
  else if (d.req) { pick(t); state.req = d.req; render(); }
  else if (d.theme) { pick(t); document.documentElement.setAttribute("data-theme", d.theme); }
});
function pick(btn) { btn.parentNode.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); }); }

render();
</script>
</body>
</html>
