<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spools · RollCall (phone mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Global styles from the approved mockups (docs/mockups/web/, direction A "Workshop").
 * Tokens come from docs/mockups/web/tokens.css. The theme is set on <html data-theme>
 * by the script in app.html and by lib/theme.svelte.ts. Components add scoped styles. */

:root,
:root[data-theme="light"] {
  --bg: #f4f2ee; /* page background */
  --surface: #ffffff; /* cards, header, tables */
  --line: #ddd8cf; /* borders and dividers */
  --text: #1c1b19;
  --muted: #5e5a53; /* secondary text; 6.5:1 on --surface */
  --accent: #b45309; /* primary buttons, active filter, Review badge */
  --onaccent: #ffffff;
  --chip: #ece8e1; /* neutral fills: hover, open-state chip, avatars */
  --lowbg: #fdecd3; /* low stock, flagged, warnings */
  --lowtext: #7c3500;
  --okbg: #dcefe2;
  --oktext: #1f5c33;
  --okdot: #2f8a4e;
  --track: #e9e5de; /* % left bar: track */
  --fill: #3f3b35; /* % left bar: fill */
  --fillLow: #c2410c; /* % left bar: nearly out */
  --danger: #b3261e;

  /* Spool ring swatch: same treatment for every color */
  --ringShadow: 0 1px 3px rgba(0, 0, 0, 0.22), 0 4px 12px rgba(0, 0, 0, 0.16);
  --holeShadow: inset 0 1px 3px rgba(0, 0, 0, 0.18);
  --ringShadowSmall: var(--ringShadow);

  --font-head: "Space Grotesk", system-ui, sans-serif;
  --font-body: Inter, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* The phone layout's bottom bar, and what the pages leave free for it. */
  --bottom-bar: calc(84px + env(safe-area-inset-bottom, 0px));

  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #121212;
  --surface: #1c1c1b;
  --line: #34322e;
  --text: #f2efe9;
  --muted: #a9a49b;
  --accent: #f59e0b;
  --onaccent: #1a1205;
  --chip: #262523;
  --lowbg: #3a2608;
  --lowtext: #fbbf5c;
  --okbg: #173322;
  --oktext: #86d9a3;
  --okdot: #4ade80;
  --track: #2c2b28;
  --fill: #d9d4cb;
  --fillLow: #fb923c;
  --danger: #ff8a80;

  /* A gap in the surface color, a thin light rim, then a soft glow, outside and inside the
     ring, so white and black swatches both stay visible. */
  --ringShadow:
    0 0 0 1.5px var(--surface), 0 0 0 2.5px rgba(255, 255, 255, 0.3),
    0 0 10px 2px rgba(255, 255, 255, 0.1);
  --holeShadow:
    inset 0 0 0 1.5px var(--surface), inset 0 0 0 2.5px rgba(255, 255, 255, 0.3),
    inset 0 0 6px 1px rgba(255, 255, 255, 0.1);
  --ringShadowSmall:
    0 0 0 1px var(--surface), 0 0 0 1.75px rgba(255, 255, 255, 0.28),
    0 0 6px 1px rgba(255, 255, 255, 0.08), inset 0 0 0 1px var(--surface),
    inset 0 0 0 1.75px rgba(255, 255, 255, 0.28);

  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html {
  font-family: var(--font-body);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3 {
  font-family: var(--font-head);
}

h1 {
  margin: 0;
  font-size: clamp(30px, 6vw, 40px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Buttons: neutral by default, .primary for the main action. */
button {
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

button.small {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

/* A link that looks like a button, for navigation actions such as "Open spool". */
a.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 14px;
  font-weight: 600;
}

a.button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

button.danger {
  color: var(--danger);
}

/* Filter chips: round, accent when pressed. */
button.chip {
  padding: 10px 16px;
  border-radius: 999px;
}

button.chip[aria-pressed="true"] {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--onaccent);
}

input,
select,
textarea {
  font: inherit;
  font-size: 15px;
  color: var(--text);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0 12px;
  min-height: 44px;
}

textarea {
  padding: 10px 12px;
  min-height: 88px;
  resize: vertical;
}

input[type="checkbox"] {
  width: 20px;
  height: 20px;
  min-height: 0;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

/* Tables sit in a box that scrolls sideways on phones. */
/* Positioned so screen-reader-only text inside a table scrolls with it instead of widening
   the page (on a phone that pushed the bottom bar off the screen). */
.tablebox {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow-x: auto;
}

table {
  border-collapse: collapse;
  width: 100%;
}

th {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  text-align: left;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.label {
  margin: 0;
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.mono {
  font-family: var(--font-mono);
}

.muted {
  color: var(--muted);
}

.error {
  color: var(--danger);
  margin: 0;
}

.notice {
  color: var(--lowtext);
  margin: 0;
}

.badge-low {
  background: var(--lowbg);
  color: var(--lowtext);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 6px;
  white-space: nowrap;
}

.badge-hand {
  border: 1px dashed var(--muted);
  color: var(--muted);
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* Page heading: title, subtitle, and actions on the right. */
.pagehead {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
}

.pagehead p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 15px;
}

.page {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}


/* ---- Ring swatch (lib/components/ui/Ring.svelte), plus a split ring for multi-color ---- */
:root, :root[data-theme="light"] { --ringOuterSm: var(--ringShadow); --holeSm: none; }
:root[data-theme="dark"] {
  --ringOuterSm: 0 0 0 1px var(--surface), 0 0 0 1.75px rgba(255,255,255,.28), 0 0 6px 1px rgba(255,255,255,.08);
  --holeSm: inset 0 0 0 1px var(--surface), inset 0 0 0 1.75px rgba(255,255,255,.28);
}
.ring { display: inline-block; flex: none; border-radius: 50%; border-style: solid; background: var(--bg); box-shadow: var(--ringShadow), var(--holeShadow); }
.ring.sm { width: 30px; height: 30px; border-width: 8px; box-shadow: var(--ringShadowSmall); }
.ring.multi { border: 0; position: relative; box-shadow: var(--ringOuterSm); }
.ring.multi::after { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--bg); box-shadow: var(--holeSm); }
li.open .ring.multi::after, .open .ring.multi::after { background: var(--bg); }
[hidden] { display: none !important; }


body{background:#d9d5ce}
:root[data-theme="dark"] body{background:#050505}
.stage{display:flex;justify-content:center;padding:28px 16px 48px}
.phone{position:relative;width:390px;height:844px;border-radius:36px;overflow:hidden;background:var(--bg);color:var(--text);box-shadow:0 0 0 10px #1c1b19,0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column}
@media (max-width:460px){.stage{padding:0}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}

/* ---- Top bar (PhoneTopBar) ---- */
.top{display:flex;align-items:center;gap:10px;padding:18px 20px 6px;flex:none}
.top .title{margin:0;font-family:var(--font-head);font-size:28px;font-weight:700;letter-spacing:-.02em}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 108px;display:flex;flex-direction:column;gap:10px}

/* ---- Controls (InventoryControls) ---- */
.ctrl{display:flex;gap:8px}
.search{position:relative;flex:1;display:block}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding-left:38px}
.filter.on{background:var(--text);border-color:var(--text);color:var(--bg)}
.fcount{min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--onaccent);font-size:12px;font-weight:700;text-align:center}
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.typechip{display:inline-flex;align-items:center;border-radius:999px;background:var(--text);color:var(--bg)}
.typechip button{min-height:40px;border:0;background:transparent;color:inherit;font-weight:600}
.typechip .lb{padding:0 4px 0 14px}
.typechip .x{padding:0 12px 0 6px}
.clear{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:0 8px}
.summary{margin:2px 2px 0;font-size:13px;color:var(--muted)}
.summary b{color:var(--text);font-family:var(--font-mono)}

/* ---- Groups ---- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ghead{position:sticky;top:-4px;z-index:2;width:100%;justify-content:flex-start;gap:10px;min-height:56px;padding:0 14px;border:0;border-radius:14px;background:var(--surface);text-align:left;flex-wrap:wrap;row-gap:0}
.group.isopen .ghead{border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)}
.gname{font-family:var(--font-head);font-size:17px;font-weight:600}
.gmeta{color:var(--muted);font-weight:500;font-size:13px}
.gchev{color:var(--muted);transition:transform .15s;flex:none}
.ghead[aria-expanded=false] .gchev{transform:rotate(-90deg)}
.rows{margin:0;padding:0;list-style:none}
.rows > li + li{border-top:1px solid var(--line)}
.rows > li.open{background:var(--bg)}
.rows > li:last-child, .rows > li:last-child .crow{border-radius:0 0 14px 14px}
.crow{width:100%;display:grid;grid-template-columns:30px minmax(0,1fr) 18px;align-items:center;gap:12px;min-height:64px;padding:10px 12px 10px 14px;border:0;border-radius:0;background:transparent;text-align:left;font-weight:400}
.ctext{display:flex;flex-direction:column;gap:3px;min-width:0}
.cname{font-family:var(--font-head);font-weight:600;font-size:15px;line-height:1.25}
.chex{font-family:var(--font-mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:0 10px}
.chex .code{color:var(--text);font-weight:500}
.badges{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.chev{color:var(--muted);transition:transform .15s}
li.open .chev{transform:rotate(180deg)}
.badge-disc{border:1px solid var(--muted);color:var(--muted);border-radius:6px;padding:0 7px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-multi{background:var(--chip);color:var(--text);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-own{background:var(--text);color:var(--bg);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.how{font-size:12px}
.linked-none{margin:0;font-size:13px}
.linked-none a{text-decoration:underline}
.storerow{display:flex}
.store{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%}
.badge-sim{background:var(--okbg);color:var(--oktext);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;white-space:nowrap}
.nosim{color:var(--muted);font-size:12px}
.detail{display:flex;flex-direction:column;gap:10px;padding:0 14px 14px 56px}
.detail h4{margin:2px 0 0}
.matches{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:30px minmax(0,1fr);align-items:start;column-gap:10px}
.match .ring{margin-top:2px}
.mtext{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.mname{font-weight:600;font-size:14px;min-height:24px;display:inline-flex;align-items:center}
.warn{background:var(--lowbg);color:var(--lowtext);border-radius:6px;padding:2px 7px;font-size:12px;font-weight:600}
.mfacts{grid-column:2;display:flex;gap:10px;font-size:12px;color:var(--muted)}
.mfacts .de{color:var(--text);font-weight:700}
.none{margin:0;font-size:14px}
.foot{margin:0;font-size:12px}
.pagefoot{margin:6px 2px 0;font-size:12px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:4px}
.pagefoot p{margin:0}
.stale{color:var(--lowtext);font-weight:600}

/* ---- Empty state ---- */
.empty{align-items:flex-start;padding:20px}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--muted)}
.emptyicon{width:52px;height:52px;border-radius:14px;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.btncol{display:flex;flex-direction:column;gap:8px;width:100%}

/* ---- Bottom bar (PhoneNav) ---- */
.bar{position:absolute;left:0;right:0;bottom:0;z-index:42;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;padding:8px 14px 14px;border-top:1px solid var(--line);background:var(--surface)}
.end{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:64px;min-height:48px;padding:0 6px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
.start{justify-self:start}
.finish{justify-self:end}
.end[aria-expanded=true]{color:var(--text)}
.dot{position:absolute;top:4px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.scan{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:-30px;color:var(--text);font-size:12px;font-weight:700}
.fab{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--onaccent);box-shadow:0 0 0 5px var(--surface),0 4px 14px rgba(0,0,0,.25)}
.binitial{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--chip);color:var(--text);font-size:13px;font-weight:700}

/* ---- Sheets (MenuSheet, FilterSheet) ---- */
.dim{position:absolute;inset:0;z-index:40;border:0;border-radius:0;padding:0;min-height:0;background:rgba(0,0,0,.45)}
.dim.over{z-index:50}
.sheet{position:absolute;left:0;right:0;bottom:84px;z-index:41;display:flex;flex-direction:column;gap:14px;max-height:calc(100% - 108px);overflow-y:auto;padding:10px 16px 18px;border-radius:24px 24px 0 0;background:var(--surface);outline:none}
.sheet.fs{bottom:0;z-index:51;gap:18px;max-height:calc(100% - 48px);padding-bottom:18px}
.grip{align-self:center;width:40px;height:5px;border-radius:999px;background:var(--line)}
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.adminpages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600}
.item.small{flex-direction:column;justify-content:center;gap:4px;min-height:68px;font-size:14px}
.item[aria-current=page]{background:var(--text);border-color:var(--text);color:var(--bg)}
.ibadge{margin-left:auto;background:var(--accent);color:var(--onaccent);border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.shead{display:flex;align-items:center;justify-content:space-between}
.shead h2{margin:0;font-size:20px}
.sheet section{display:flex;flex-direction:column;gap:10px}
.sheet h3{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip .n{margin-left:4px;font-family:var(--font-mono);font-size:12px;opacity:.75}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.sfoot{display:grid;grid-template-columns:auto 1fr;gap:10px}

/* ---- Mockup controls (not part of the design) ---- */
.mock{background:#37352f;color:#f2efe9;padding:8px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;font-size:12px}
.mock strong{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.mock .mrow{display:flex;align-items:center;gap:8px}
.mock .mrow > span{opacity:.8}
.mock .mseg{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.12)}
.mock button{min-height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:inherit;font-size:12px}
.mock button[aria-pressed=true]{background:#f2efe9;color:#1c1b19}

/* ---- Spools on a phone (this mockup) ---- */
.count{margin:0 2px;font-size:13px;color:var(--muted)}
.notice{margin:0 2px;font-size:14px;color:var(--muted)}
.slist{flex:none;margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.slist > li + li{border-top:1px solid var(--line)}
.slist > li.open{background:var(--bg)}
.slist > li.sel{background:var(--chip)}
.srow{display:flex;align-items:stretch}
.pick{flex:none;width:46px;display:flex;align-items:center;justify-content:center;padding-left:4px;cursor:pointer}
.pick input{width:20px;height:20px;margin:0}
.crow{flex:1;min-width:0;display:grid;grid-template-columns:30px minmax(0,1fr) auto 16px;align-items:center;justify-content:stretch;gap:10px;min-height:64px;padding:10px 12px 10px 4px;border:0;border-radius:0;background:transparent;text-align:left;font-weight:400}
.viewer .crow{padding-left:14px}
.stext{display:flex;flex-direction:column;gap:2px;min-width:0}
.sname{font-family:var(--font-head);font-weight:600;font-size:15px;line-height:1.25}
.smeta{font-family:var(--font-mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;align-items:center;gap:8px;margin-top:3px}
.mini .track{flex:1;max-width:120px;height:4px;border-radius:999px;background:var(--track);overflow:hidden}
.mini .track > span{display:block;height:100%;border-radius:999px;background:var(--fill)}
.mini.low .track > span{background:var(--fillLow)}
.mini .p{font-family:var(--font-mono);font-size:12px;font-weight:700}
.mini.low .p{color:var(--lowtext)}
.mini .unk{font-size:12px;color:var(--muted)}
.st{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;border:1px solid transparent}
.st.sealed{background:var(--text);color:var(--bg)}
.st.open{background:var(--chip);color:var(--text);border-color:var(--line)}
.st.empty{color:var(--muted);border:1px dashed var(--muted)}
.sdetail{display:flex;flex-direction:column;gap:12px;padding:2px 14px 14px 90px}
.viewer .sdetail{padding-left:54px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0;font-size:14px;align-items:center}
.facts dt{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.facts dd{margin:0}
.facts .d{font-family:var(--font-mono);font-size:13px}
.pb{display:flex;align-items:center;gap:10px}
.pb .track{flex:1;height:8px;min-width:40px;border-radius:999px;background:var(--track);overflow:hidden}
.pb .track > span{display:block;height:100%;border-radius:999px;background:var(--fill)}
.pb.low .track > span{background:var(--fillLow)}
.pb .p{font-family:var(--font-mono);font-size:13px;font-weight:700;width:40px;text-align:right}
.pb.low .p{color:var(--lowtext)}
.sdetail .button{width:100%}
.pager{flex:none;display:flex;flex-direction:column;gap:8px;margin:2px;color:var(--muted);font-size:14px}
.pager .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scroll.moving{padding-bottom:240px}

/* ---- Move bar: pinned above the bottom bar while anything is ticked ---- */
.movebar{position:absolute;left:10px;right:10px;bottom:118px;z-index:30;display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;background:var(--text);color:var(--bg);box-shadow:0 6px 22px rgba(0,0,0,.3)}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mtop strong{font-size:15px}
.mtop button{min-height:36px;padding:0 12px;background:transparent;color:inherit;border-color:var(--muted)}
.mbot{display:flex;align-items:center;gap:8px}
.mbot label{font-size:14px;font-weight:600;white-space:nowrap}
.mbot input{flex:1;min-width:0;background:var(--surface);color:var(--text)}

/* ---- Bottom bar centre (#171) ---- */
.pair{display:flex;gap:10px;align-items:flex-end;margin-top:-30px}
.pair .scan{margin-top:0}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.side .disc{width:44px;height:44px;border-radius:50%;background:var(--chip);color:var(--text);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--surface)}
.mock .note{opacity:.7;flex-basis:100%}
</style>
</head>
<body>
<aside class="mock" aria-label="Mockup controls">
<strong>Mockup controls</strong>
<div class="mrow"><span>Role</span><div class="mseg" role="group" aria-label="Role"><button type="button" data-role="editor" aria-pressed="true">Editor</button><button type="button" data-role="viewer" aria-pressed="false">Viewer</button></div></div>
<div class="mrow"><span>Scan</span><div class="mseg" role="group" aria-label="Scan"><button type="button" data-scan="yes" aria-pressed="true">Available</button><button type="button" data-scan="no" aria-pressed="false">Not available</button></div></div>
<div class="mrow"><span>Theme</span><div class="mseg" role="group" aria-label="Theme"><button type="button" data-theme="light" aria-pressed="true">Light</button><button type="button" data-theme="dark" aria-pressed="false">Dark</button></div></div>
<span class="note">Tick a spool to see the Move bar; tap a row to expand it. The mockup pages by 8 so the pager works; the app pages by 50. Sample data is fake.</span>
</aside>

<div class="stage">
<div class="phone" id="phone">
<header class="top">
<a href="#" aria-label="RollCall, Inventory"><svg width="30" height="30" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="62" fill="#C8324B"></circle><circle cx="70" cy="70" r="50" fill="none" stroke="#FFF7F5" stroke-width="4" opacity="0.45"></circle><circle cx="70" cy="70" r="40" fill="none" stroke="#FFF7F5" stroke-width="4" opacity="0.45"></circle><circle cx="70" cy="70" r="30" fill="#FFF7F5"></circle><polyline points="56,71 66,81 85,60" fill="none" stroke="#C8324B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></a>
<p class="title" aria-hidden="true">Spools</p>
</header>

<div class="scroll" id="scroll">
<h1 class="sr-only">Spools</h1>
<p class="count" id="count"></p>
<div class="ctrl">
<label class="search">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="q" type="search" aria-label="Search spools" placeholder="Product, type, location or notes" maxlength="100" autocomplete="off">
</label>
<button type="button" class="filter" id="filterbtn" aria-haspopup="dialog" data-act="sheet">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
Filter<span class="fcount" id="fcount" aria-hidden="true" hidden></span>
</button>
</div>
<div class="quick" id="quick" role="group" aria-label="Filters on"></div>
<p class="notice" id="notice" role="status"></p>
<ul class="slist" id="list"></ul>
<div class="pager" id="pager"></div>
</div>

<div id="movebar-slot"></div>
<div id="overlay"></div>

<nav aria-label="App" class="bar">
<a class="end start" href="PhoneMenu.dc.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Menu</a>
<div id="centre"></div>
<a class="end finish" href="PhoneAccount.dc.html"><span class="binitial" aria-hidden="true">F</span>frank</a>
</nav>
</div>
</div>

<script>
/* Sample data. pct: the AMS's remaining % (null when not seen). slot: the AMS slot, when loaded. */
var P = {
  blk: { name: "Black PLA Basic", type: "PLA", rgba: "#1b1b1b", out: 10 },
  wht: { name: "Jade White PLA Basic", type: "PLA", rgba: "#f4f1e8", out: 10 },
  cyn: { name: "Cyan PLA Matte", type: "PLA", rgba: "#0086d6", out: 10 },
  red: { name: "Red PLA Basic", type: "PLA", rgba: "#c12e1f", out: 10 },
  grn: { name: "Bambu Green PETG HF", type: "PETG", rgba: "#00ae42", out: 10 },
  org: { name: "Orange PETG HF", type: "PETG", rgba: "#f57c00", out: 10 },
  abs: { name: "Black ABS", type: "ABS", rgba: "#222222", out: 10 },
  tpu: { name: "Gray TPU 95A", type: "TPU", rgba: "#8e9089", out: 15 }
};
var SPOOLS = [
  { id: 50, p: "red", state: "sealed", loc: "Shelf B", rec: "Nov 18" },
  { id: 47, p: "org", state: "sealed", loc: null, rec: "Nov 14", placeholder: true },
  { id: 45, p: "cyn", state: "sealed", loc: "Shelf A", rec: "Nov 9" },
  { id: 44, p: "cyn", state: "sealed", loc: "Shelf A", rec: "Nov 9" },
  { id: 41, p: "blk", state: "sealed", loc: "Shelf B", rec: "Nov 2" },
  { id: 38, p: "blk", state: "open", loc: null, slot: "AMS 1, slot 1 on P1S", pct: 62, rec: "Oct 12", opened: "Nov 3" },
  { id: 35, p: "wht", state: "open", loc: "Dry box 2", pct: null, rec: "Oct 12", opened: "Oct 28" },
  { id: 33, p: "grn", state: "open", loc: null, slot: "AMS 1, slot 2 on P1S", pct: 8, rec: "Sep 30", opened: "Oct 20" },
  { id: 29, p: "abs", state: "sealed", loc: "Shelf C", rec: "Sep 22" },
  { id: 22, p: "tpu", state: "open", loc: "Dry box 1", slot: "AMS HT 1 on P1S", pct: 41, rec: "Sep 5", opened: "Oct 1" },
  { id: 18, p: "blk", state: "empty", loc: null, rec: "Aug 14", opened: "Sep 2", emptied: "Oct 30" },
  { id: 15, p: "wht", state: "empty", loc: null, rec: "Jul 20", opened: "Aug 30", emptied: "Oct 11" },
  { id: 12, p: "red", state: "empty", loc: "Bin", rec: "Jun 3", opened: "Jul 1", emptied: "Sep 18" },
  { id: 9, p: "grn", state: "empty", loc: null, rec: "Dec 14, 2025", opened: "Feb 2", emptied: "Aug 9" }
];
var STATES = [["all", "All"], ["sealed", "Sealed"], ["open", "Open"], ["empty", "Used up"]];
var LABEL = { sealed: "Sealed", open: "Open", empty: "Used up" };
var TYPES = ["PLA", "PETG", "ABS", "TPU"];
var PAGE = 8;

var s = { q: "", f: { state: "all", type: "all" }, offset: 0, expanded: null, sel: {}, role: "editor", scan: true, sheet: null, notice: "" };

function prod(sp) { return P[sp.p]; }
function editor() { return s.role === "editor"; }
function matches(sp, f, q) {
  var p = prod(sp);
  if (f.state !== "all" && sp.state !== f.state) return false;
  if (f.type !== "all" && p.type !== f.type) return false;
  q = q.trim().toLowerCase();
  if (q && (p.name + " " + p.type + " " + (sp.loc || "")).toLowerCase().indexOf(q) < 0) return false;
  return true;
}
function shown(f) { return SPOOLS.filter(function (sp) { return matches(sp, f || s.f, s.q); }); }
function selCount() { return Object.keys(s.sel).length; }
function nearly(sp) { return sp.state === "open" && sp.pct !== null && sp.pct !== undefined && sp.pct <= prod(sp).out; }
/* While a spool is loaded, its AMS slot is shown as its location; the hand-written one is kept
   and shows again once the spool leaves the AMS. */
function where(sp) { return sp.slot || sp.loc || ""; }

function countLine() {
  var c = { sealed: 0, open: 0, empty: 0 };
  SPOOLS.forEach(function (sp) { c[sp.state]++; });
  return SPOOLS.length + " spools · " + c.sealed + " sealed · " + c.open + " open · " + c.empty + " used up";
}

function mini(sp) {
  if (sp.state !== "open") return "";
  if (sp.pct === null) return '<span class="mini"><span class="unk">Not seen by the AMS</span></span>';
  return '<span class="mini' + (nearly(sp) ? " low" : "") + '"><span class="track" aria-hidden="true"><span style="width:' + sp.pct + '%"></span></span><span class="p">' + sp.pct + "%</span></span>";
}
function bigBar(sp) {
  if (sp.state !== "open") return '<span class="muted">—</span>';
  if (sp.pct === null) return '<span class="muted">Not seen by the AMS</span>';
  return '<span class="pb' + (nearly(sp) ? " low" : "") + '"><span class="track" aria-hidden="true"><span style="width:' + sp.pct + '%"></span></span><span class="p">' + sp.pct + "%</span></span>";
}

function rowHtml(sp) {
  var p = prod(sp), open = s.expanded === sp.id, ticked = !!s.sel[sp.id];
  var meta = "#" + sp.id + (sp.placeholder ? " · no tag yet" : "") + (where(sp) ? " · " + where(sp) : sp.placeholder ? "" : " · —");
  var h = '<li class="' + (open ? "open " : "") + (ticked ? "sel" : "") + '"><div class="srow">';
  if (editor()) h += '<label class="pick"><input type="checkbox" data-tick="' + sp.id + '" aria-label="Select spool #' + sp.id + '"' + (ticked ? " checked" : "") + "></label>";
  h += '<button type="button" class="crow" data-row="' + sp.id + '" aria-expanded="' + open + '" aria-controls="d-' + sp.id + '">' +
    '<span class="ring sm" style="border-color:' + p.rgba + '"></span>' +
    '<span class="stext"><span class="sname">' + p.name + '</span><span class="smeta">' + meta + "</span>" + mini(sp) + "</span>" +
    '<span class="st ' + sp.state + '">' + LABEL[sp.state] + "</span>" +
    '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>' +
    "</button></div>";
  if (open) {
    h += '<div class="sdetail" id="d-' + sp.id + '"><dl class="facts">' +
      "<dt>Location</dt><dd>" + (where(sp) || '<span class="muted">—</span>') + "</dd>" +
      (sp.placeholder ? '<dt>Tag</dt><dd>No tag yet. The first scan of this product links it.</dd>' : "") +
      "<dt>Left</dt><dd>" + bigBar(sp) + "</dd>" +
      '<dt>Received</dt><dd class="d">' + (sp.rec || "—") + "</dd>" +
      '<dt>Opened</dt><dd class="d">' + (sp.opened || "—") + "</dd>" +
      '<dt>Used up</dt><dd class="d">' + (sp.emptied || "—") + "</dd>" +
      '</dl><a class="button" href="#">View spool</a></div>';
  }
  return h + "</li>";
}

function summary(f) {
  var parts = [];
  if (f.state !== "all") parts.push(LABEL[f.state]);
  if (f.type !== "all") parts.push(f.type);
  return parts.join(" · ");
}

function render() {
  var list = shown(), page = list.slice(s.offset, s.offset + PAGE);
  document.getElementById("count").textContent = countLine();
  document.getElementById("phone").classList.toggle("viewer", !editor());

  var on = (s.f.state !== "all" ? 1 : 0) + (s.f.type !== "all" ? 1 : 0);
  var fb = document.getElementById("filterbtn"), fc = document.getElementById("fcount");
  fb.classList.toggle("on", on > 0); fc.hidden = on === 0; fc.textContent = on;
  fb.setAttribute("aria-label", on ? "Filter, " + on + " on" : "Filter");
  document.getElementById("quick").innerHTML = on ?
    '<span class="typechip"><button type="button" class="lb" data-act="sheet">' + summary(s.f) + '</button><button type="button" class="x" aria-label="Clear the filters" data-act="clearf">✕</button></span><button type="button" class="clear" data-act="clearf">Clear</button>' : "";

  var n = document.getElementById("notice"); n.textContent = s.notice; n.hidden = !s.notice;
  document.getElementById("list").innerHTML = page.length ? page.map(rowHtml).join("") : '<li style="padding:18px 14px" class="muted">No spools match.</li>';
  document.getElementById("list").hidden = false;
  document.getElementById("pager").innerHTML =
    "<span>" + (list.length ? "Showing " + (s.offset + 1) + "–" + (s.offset + page.length) + " of " + list.length : "No spools match") + "</span>" +
    '<div class="btns"><button type="button" data-act="prev"' + (s.offset === 0 ? " disabled" : "") + '>Previous</button><button type="button" data-act="next"' + (s.offset + PAGE >= list.length ? " disabled" : "") + ">Next</button></div>";
  renderMove(); renderCentre();
}

function renderMove() {
  var n = selCount(), slot = document.getElementById("movebar-slot");
  document.getElementById("scroll").classList.toggle("moving", editor() && n > 0);
  if (!editor() || n === 0) { slot.innerHTML = ""; return; }
  var known = {};
  SPOOLS.forEach(function (sp) { if (sp.loc) known[sp.loc] = true; });
  var keep = document.getElementById("moveto"), val = keep ? keep.value : "";
  slot.innerHTML = '<form class="movebar" id="moveform" aria-label="Move selected spools">' +
    '<div class="mtop"><strong>' + n + " selected</strong>" + '<button type="button" data-act="unselect">Clear</button></div>' +
    '<div class="mbot"><label for="moveto">Move to</label><input id="moveto" type="text" list="known" maxlength="100" placeholder="Blank clears it"><button type="submit" class="primary">Move</button></div>' +
    '<datalist id="known">' + Object.keys(known).sort().map(function (l) { return '<option value="' + l + '"></option>'; }).join("") + "</datalist></form>";
  document.getElementById("moveto").value = val;
}

function renderCentre() {
  var c = document.getElementById("centre");
  var plus = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>';
  var scan = '<a class="scan" href="../mobile-scanner/Scan.dc.html"><span class="fab" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="12" y="6" width="20" height="36" rx="4"></rect><path d="M19 37h6"></path><path d="M36 18a9 9 0 0 1 0 12M40 14a15 15 0 0 1 0 20"></path></svg></span>Scan</a>';
  if (s.scan && editor()) c.innerHTML = '<div class="pair">' + scan + '<a class="side" href="#"><span class="disc" aria-hidden="true">' + plus + "</span>Add spool</a></div>";
  else if (s.scan) c.innerHTML = '<div class="pair">' + scan + "</div>";
  else if (editor()) c.innerHTML = '<a class="scan" href="#"><span class="fab" aria-hidden="true">' + plus.replace(/20/g, "30") + "</span>Add spool</a>";
  else c.innerHTML = "<span></span>";
}

function sheetHtml() {
  var d = s.sheet, n = shown(d).length;
  function chips(key, opts) {
    return opts.map(function (o) { return '<button type="button" class="chip" data-pick="' + key + '" data-val="' + o[0] + '" aria-pressed="' + (d[key] === o[0]) + '">' + o[1] + "</button>"; }).join("");
  }
  return '<button type="button" class="dim over" aria-label="Close the filters" tabindex="-1" data-act="closesheet"></button>' +
    '<div class="sheet fs" role="dialog" aria-modal="true" aria-labelledby="filter-h"><span class="grip" aria-hidden="true"></span>' +
    '<div class="shead"><h2 id="filter-h">Filter</h2><button type="button" class="small" data-act="closesheet">Close</button></div>' +
    '<section aria-labelledby="state-h"><h3 id="state-h" class="label">State</h3><div class="chips" role="group" aria-labelledby="state-h">' + chips("state", STATES) + "</div></section>" +
    '<section aria-labelledby="type-h"><h3 id="type-h" class="label">Type</h3><div class="chips" role="group" aria-labelledby="type-h">' + chips("type", [["all", "All"]].concat(TYPES.map(function (t) { return [t, t]; }))) + "</div></section>" +
    '<div class="sfoot"><button type="button" data-act="sheetclear">Clear</button><button type="button" class="primary" data-act="apply">Show ' + n + (n === 1 ? " spool" : " spools") + "</button></div></div>";
}
function renderOverlay() { document.getElementById("overlay").innerHTML = s.sheet ? sheetHtml() : ""; }

/* Changing a filter or the search goes back to the first page and unticks everything, as today. */
function refilter() { s.offset = 0; s.sel = {}; s.expanded = null; s.notice = ""; render(); }

document.getElementById("q").addEventListener("input", function (e) { s.q = e.target.value; refilter(); });

document.addEventListener("change", function (e) {
  var id = e.target.getAttribute && e.target.getAttribute("data-tick");
  if (!id) return;
  if (s.sel[id]) delete s.sel[id]; else s.sel[id] = true;
  s.notice = ""; render();
});

document.addEventListener("submit", function (e) {
  if (e.target.id !== "moveform") return;
  e.preventDefault();
  var to = document.getElementById("moveto").value.trim(), n = selCount();
  SPOOLS.forEach(function (sp) { if (s.sel[sp.id]) sp.loc = to || null; });
  s.notice = to ? "Moved " + n + " to " + to + "." : "Cleared the location of " + n + ".";
  s.sel = {}; render();
});

document.addEventListener("click", function (e) {
  var t = e.target.closest("button, [data-row]");
  if (!t) return;
  var d = t.dataset;
  if (d.row) { var id = Number(d.row); s.expanded = s.expanded === id ? null : id; render(); }
  else if (d.act === "sheet") { s.sheet = { state: s.f.state, type: s.f.type }; renderOverlay(); var first = document.querySelector(".sheet.fs .chip"); if (first) first.focus(); }
  else if (d.act === "closesheet") { s.sheet = null; renderOverlay(); document.getElementById("filterbtn").focus(); }
  else if (d.pick) { s.sheet[d.pick] = d.val; renderOverlay(); }
  else if (d.act === "sheetclear") { s.sheet = { state: "all", type: "all" }; renderOverlay(); }
  else if (d.act === "apply") { s.f = s.sheet; s.sheet = null; renderOverlay(); refilter(); document.getElementById("filterbtn").focus(); }
  else if (d.act === "clearf") { s.f = { state: "all", type: "all" }; refilter(); }
  else if (d.act === "prev") { s.offset = Math.max(0, s.offset - PAGE); s.expanded = null; render(); }
  else if (d.act === "next") { s.offset += PAGE; s.expanded = null; render(); }
  else if (d.act === "unselect") { s.sel = {}; render(); }
  else if (d.role) { pick(t); s.role = d.role; s.sel = {}; render(); }
  else if (d.scan) { pick(t); s.scan = d.scan === "yes"; render(); }
  else if (d.theme) { pick(t); document.documentElement.setAttribute("data-theme", d.theme); }
});
function pick(btn) { btn.parentNode.querySelectorAll("button").forEach(function (b) { b.setAttribute("aria-pressed", String(b === btn)); }); }

document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && s.sheet) { s.sheet = null; renderOverlay(); document.getElementById("filterbtn").focus(); }
});

render();
</script>
</body>
</html>
