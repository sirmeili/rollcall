apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'jacoco'

// Releases (android/README.md): the version comes from the tag, as -PappVersion=1.2.3, and
// the version code from it (1.2.3 -> 10203), so every release counts as an update. Other
// builds are version "dev".
def appVersion = project.findProperty('appVersion')?.toString()
def appVersionCode = 1
if (appVersion != null) {
    def parts = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!parts.matches()) {
        throw new GradleException("appVersion must look like 1.2.3")
    }
    def (major, minor, patch) = (1..3).collect { parts.group(it).toInteger() }
    if (minor > 99 || patch > 99 || major + minor + patch == 0) {
        throw new GradleException("appVersion parts must be 0-99, and not all 0")
    }
    appVersionCode = major * 10000 + minor * 100 + patch
}

// The release key comes from the environment (the release job writes it from GitHub's
// secrets); it is never in the repo. Without it, release builds are unsigned.
def keystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')

android {
    // The Kotlin package keeps the old name until the code rename; the app ID is RollCall's.
    namespace = "io.github.sirmeili.filamenttracker"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.sirmeili.rollcall"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion ?: "dev"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Two builds of the app (android/README.md, Flavors): google may use Google's services,
    // foss holds no Google code. They share the app ID and the release key, so a phone switches
    // by installing the other over the top and keeps its pairing.
    flavorDimensions = ["distribution"]
    productFlavors {
        google {
            dimension "distribution"
        }
        foss {
            dimension "distribution"
        }
    }
    signingConfigs {
        if (keystoreFile) {
            release {
                storeFile file(keystoreFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'rollcall'
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            enableUnitTestCoverage true
            // Development builds sit next to the release app instead of replacing it.
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "RollCall (dev)"
            resValue "string", "title_activity_main", "RollCall (dev)"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            resValue "string", "app_name", "RollCall"
            resValue "string", "title_activity_main", "RollCall"
            if (keystoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.android.gms:play-services-code-scanner:$codeScannerVersion"
    // Phone notifications through a UnifiedPush distributor such as ntfy, in both flavors.
    implementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

// Unit-test coverage, gated at 90% of lines. The Android glue (the Capacitor plugin, the
// MifareClassic adapter, Keystore and SharedPreferences storage, the activity, the UnifiedPush
// connector and showing notifications) needs a real phone and is covered by the phone
// checklist instead. docs/testing.md lists these exclusions;
// change it with this list. Each flavor is tested and gated on its own (coverageReportGoogle,
// coverageCheckFoss, ...); coverageReport and coverageCheck run both.
def coverageExcludes = [
    '**/R.class', '**/R$*.class', '**/BuildConfig.*', '**/Manifest*.*',
    '**/MainActivity*', '**/FilamentTrackerPlugin*', '**/AndroidMifare*',
    '**/KeystoreKey*', '**/PrefsValues*',
    '**/UnifiedPush*', '**/Notifier*',
    '**/PhotoDownloader*',
]

['google', 'foss'].each { flavor ->
    def Flavor = flavor.capitalize()
    def variant = "${flavor}Debug"
    def classes = fileTree(dir: layout.buildDirectory.dir("tmp/kotlin-classes/$variant"), excludes: coverageExcludes)
    def sources = files('src/main/java', "src/$flavor/java")
    def data = fileTree(dir: layout.buildDirectory, includes: ["outputs/unit_test_code_coverage/${variant}UnitTest/*.exec"])

    tasks.register("coverageReport$Flavor", JacocoReport) {
        dependsOn "test${Flavor}DebugUnitTest"
        classDirectories.setFrom(classes)
        sourceDirectories.setFrom(sources)
        executionData.setFrom(data)
        reports {
            xml.required = true
            html.required = true
        }
    }

    tasks.register("coverageCheck$Flavor", JacocoCoverageVerification) {
        dependsOn "coverageReport$Flavor"
        classDirectories.setFrom(classes)
        sourceDirectories.setFrom(sources)
        executionData.setFrom(data)
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    minimum = 0.90
                }
            }
        }
    }
}

tasks.register('coverageReport') {
    dependsOn 'coverageReportGoogle', 'coverageReportFoss'
}

tasks.register('coverageCheck') {
    dependsOn 'coverageCheckGoogle', 'coverageCheckFoss'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
